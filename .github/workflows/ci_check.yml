name: CI Check
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [develop, master]
  merge_group:
    types: [checks_requested]
env:
  STORYBOOK_DISABLE_TELEMETRY: "1"
permissions:
  contents: read
jobs:
  quality:
    name: CI Check
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    env:
      npm_config_store_dir: /tmp/ha-ui-pnpm-store
    # The catalog has its own phase deadlines; this job also verifies packages and SSR.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Verify packed consumers and candidate provenance
        env:
          HA_UI_PACKED_EXPECTED_REVISION: ${{ github.sha }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$(pwd -P)"
          pnpm test:package
      - run: pnpm test:ssr
      - run: pnpm storybook:build
      - name: Run the browser engine matrix
        shell: bash
        run: |
          test "$HOME" = /github/home
          original_owner=$(stat -c '%u:%g' /github/home)
          trap 'chown -- "$original_owner" /github/home' EXIT
          chown -- "$(id -u):$(id -g)" /github/home
          pnpm test:engines
      - run: pnpm test:storybook
      # Read the original catalog SDK at the reviewed revision; never rewrite it.
      - name: Read the original specification SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vypdev/copilot
          ref: 3e7ceea08e6131360e026937d1c0cc1b120472e0
          path: .validation/copilot-sdk
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/infrastructure/specification_catalog_validator.cjs
            src/infrastructure/specification_catalog_publication.cjs
            src/domain/specification_catalog_path_policy.cjs
      - name: Validate the actual specification catalog
        run: >-
          node -e "require('./.validation/copilot-sdk/src/infrastructure/specification_catalog_validator.cjs').main([], process.cwd())"
      - name: Retain source coverage and compiled package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-ui-validation-${{ github.sha }}
          path: |
            build/storybook/
            coverage/
            packages/*/dist/
            test-results/
            .vitest/attachments/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Retain the verified npm candidate for the production SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate-${{ github.sha }}
          path: |
            test-results/packed-cohort.json
            test-results/packages/*.tgz
          if-no-files-found: error
          retention-days: 30
