name: CI Check
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [develop, master]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  quality:
    name: CI Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:package
      # Read the original catalog SDK at the reviewed revision; never rewrite it.
      - name: Read the original specification SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vypdev/copilot
          ref: 3e7ceea08e6131360e026937d1c0cc1b120472e0
          path: .validation/copilot-sdk
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/infrastructure/specification_catalog_validator.cjs
            src/infrastructure/specification_catalog_publication.cjs
            src/domain/specification_catalog_path_policy.cjs
      - name: Validate the actual specification catalog
        run: >-
          node -e "require('./.validation/copilot-sdk/src/infrastructure/specification_catalog_validator.cjs').main([], process.cwd())"
      - name: Retain source coverage and compiled package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-ui-validation-${{ github.sha }}
          path: |
            coverage/
            packages/core/dist/
            test-results/
          if-no-files-found: error
          retention-days: 7
