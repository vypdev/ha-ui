name: CI Check
on:
  push:
    branches: ['**']
env:
  STORYBOOK_DISABLE_TELEMETRY: "1"
permissions:
  contents: read
jobs:
  quality:
    name: CI Check
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    env:
      # Linux ARM64 manifest from the Playwright 1.64.1 Noble index.
      HA_UI_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:f609973e8fd93f38a5ddfd706a65805294247dae8d81b2541c0afe2787746197
    # The catalog has its own phase deadlines; this job also verifies packages and SSR.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate the catalog and bind packed consumers to the checked commit
        shell: bash
        env:
          HA_UI_PACKED_EXPECTED_REVISION: ${{ github.sha }}
        run: bash .github/scripts/verify-catalog.sh
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Read the original catalog SDK at the reviewed revision; never rewrite it.
      - name: Read the original specification SDK
        uses: actions/checkout@v7.0.1
        with:
          repository: vypdev/copilot
          ref: 3e7ceea08e6131360e026937d1c0cc1b120472e0
          path: .validation/copilot-sdk
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/infrastructure/specification_catalog_validator.cjs
            src/infrastructure/specification_catalog_publication.cjs
            src/domain/specification_catalog_path_policy.cjs
      - name: Validate the actual specification catalog
        run: >-
          node -e "require('./.validation/copilot-sdk/src/infrastructure/specification_catalog_validator.cjs').main([], process.cwd())"
      - name: Retain source coverage and compiled package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shared-ui-validation-${{ github.sha }}
          path: |
            build/storybook/
            coverage/
            packages/*/dist/
            test-results/
            .vitest/attachments/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Retain the verified npm candidate for the production SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-candidate-${{ github.sha }}
          path: |
            test-results/packed-cohort.json
            test-results/packages/*.tgz
          if-no-files-found: error
          retention-days: 30
