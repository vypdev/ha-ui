name: Storybook Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
env:
  STORYBOOK_DISABLE_TELEMETRY: "1"
concurrency:
  group: storybook-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    env:
      # Linux ARM64 manifest from the same Playwright 1.64.1 Noble index as CI.
      HA_UI_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:f609973e8fd93f38a5ddfd706a65805294247dae8d81b2541c0afe2787746197
    # The published catalog runs the same browser gates as CI.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify Storybook in Linux
        shell: bash
        run: bash .github/scripts/verify-catalog.sh
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/storybook
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified static catalog
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
